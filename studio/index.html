<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Studio</title>
<link rel="icon" href="data:,">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root {
  --bg: #15171a; --panel: #1d2024; --raised: #262a2f; --line: #33383e; --text: #e4e6e9; --dim: #959ba3;
  --accent: #6ea8ff; --keep: #4cc38a; --reject: #ec6a5e; --warn: #e0b341;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; height: 100vh;
  display: flex; flex-direction: column; }
header { display: flex; gap: 16px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line);
  background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
nav button { background: none; border: none; color: var(--dim); padding: 6px 10px; font: inherit; cursor: pointer;
  border-bottom: 2px solid transparent; }
nav button.on { color: var(--text); border-color: var(--accent); }
.spacer { flex: 1; }
select, input, textarea, button { font: inherit; color: var(--text); background: var(--raised);
  border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; }
textarea { width: 100%; resize: vertical; }
button { cursor: pointer; }
button:hover { border-color: var(--dim); }
button.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
button.keep.on { background: var(--keep); color: #04140c; border-color: var(--keep); }
button.reject.on { background: var(--reject); color: #1a0503; border-color: var(--reject); }
label { color: var(--dim); font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
label.inline { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; }
.view { flex: 1; display: none; min-height: 0; }
.view.on { display: flex; }
aside { width: 280px; flex: none; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel);
  padding: 8px 0; }
aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 12px 14px 4px; }
.item { padding: 6px 14px; cursor: pointer; display: flex; gap: 8px; align-items: center; border-left: 3px solid transparent; }
.item:hover { background: var(--raised); }
.item.on { background: var(--raised); border-left-color: var(--accent); }
.item.b { border-left-color: var(--warn); }
.item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item small, .meta { color: var(--dim); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: transparent; }
.dot.keep { background: var(--keep); } .dot.reject { background: var(--reject); }
main { flex: 1; overflow-y: auto; padding: 16px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.viewers { display: flex; gap: 10px; height: 62vh; }
.viewers > div { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
model-viewer { width: 100%; flex: 1; background: radial-gradient(#2b3037, #15171a); --poster-color: transparent; }
.cap { padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); }
.cap .path { flex: 1; min-width: 120px; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.note { flex-basis: 100%; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
.card h2 { font-size: 14px; margin: 0 0 10px; }
details > summary { cursor: pointer; color: var(--dim); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 12px; }
.clip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.clip.keep { border-color: var(--keep); } .clip.reject { opacity: .55; }
.clip video { width: 100%; display: block; background: #000; aspect-ratio: 16 / 9; }
.clip .cap { border: none; }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--raised); color: var(--dim); }
.badge.warn { color: var(--warn); }
.toolbar { position: sticky; top: -16px; z-index: 2; background: var(--bg); padding: 8px 0; display: flex; gap: 6px;
  align-items: center; flex-wrap: wrap; }
.refs { display: flex; gap: 8px; flex-wrap: wrap; }
.refs img { height: 72px; border: 2px solid var(--line); border-radius: 5px; cursor: pointer; background: #000; }
.refs img.on { border-color: var(--accent); }
pre { background: #0e1012; padding: 10px; border-radius: 6px; overflow: auto; max-height: 340px; font-size: 12px;
  white-space: pre-wrap; margin: 6px 0 0; }
.job { display: grid; grid-template-columns: 90px 1fr auto; gap: 4px 12px; align-items: center; }
.status { font-size: 12px; font-weight: 600; text-transform: uppercase; }
.status.running { color: var(--accent); } .status.done { color: var(--keep); } .status.failed, .status.interrupted { color: var(--reject); }
.status.queued, .status.cancelled { color: var(--dim); }
.bar { height: 4px; background: var(--raised); border-radius: 2px; grid-column: 2 / 4; }
.bar > div { height: 100%; background: var(--accent); border-radius: 2px; }
.empty { color: var(--dim); padding: 40px; text-align: center; }
#toast { position: fixed; bottom: 16px; right: 16px; background: var(--raised); border: 1px solid var(--line);
  padding: 10px 14px; border-radius: 6px; display: none; max-width: 420px; }
@media (max-width: 760px) { .view.on { flex-direction: column; } aside { width: auto; max-height: 30vh; border-right: none; }
  .viewers { flex-direction: column; height: auto; } .viewers > div { height: 55vh; } }
</style>
</head>
<body>
<header>
  <h1>Character Studio</h1>
  <select id="project"></select>
  <nav>
    <button data-tab="models" class="on">Models</button>
    <button data-tab="clips">Clips</button>
    <button data-tab="jobs">Jobs <span id="jobcount" class="badge"></span></button>
  </nav>
  <div class="spacer"></div>
  <label class="inline"><input type="checkbox" id="hideRejected"> hide rejected</label>
</header>

<section class="view on" id="models">
  <aside id="modelList"></aside>
  <main>
    <div class="viewers" id="viewers"></div>
    <p class="meta">Click a model to view it; Shift-click another to compare side by side (cameras move together).
      Keys: K keep, R reject.</p>
    <details class="card" id="newModel">
      <summary>New model from an image (TRELLIS.2)</summary>
      <div style="margin-top:10px">
        <div class="refs" id="images"></div>
        <div class="row" style="margin-top:10px">
          <label>Upload image <input type="file" id="upload" accept="image/png,image/jpeg,image/webp"></label>
          <label>Project <input id="tProject" size="12"></label>
          <label>Folder <input id="tFolder" size="12" placeholder="pipeline type"></label>
          <label>Pipeline <select id="tType"></select></label>
          <label>Faces <input id="tFaces" type="number" value="200000" step="10000" style="width:100px"></label>
          <label>Texture <select id="tTex"><option>1024</option><option selected>2048</option><option>4096</option></select></label>
          <button class="primary" id="tGo">Queue</button>
        </div>
      </div>
    </details>
  </main>
</section>

<section class="view" id="clips">
  <aside id="moveList"></aside>
  <main id="moveMain"></main>
</section>

<section class="view" id="jobs">
  <main id="jobList"></main>
</section>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', body: body instanceof Blob ? body : JSON.stringify(body)});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
};
const file = p => '/files/' + p.split('/').map(encodeURIComponent).join('/');
const mb = n => (n / 2 ** 20).toFixed(n > 2 ** 24 ? 0 : 1) + ' MB';
const ago = t => { const s = Date.now() / 1000 - t; return s < 3600 ? Math.round(s / 60) + ' min ago' :
  s < 86400 ? Math.round(s / 3600) + ' h ago' : new Date(t * 1000).toLocaleDateString(); };
function toast(msg, ms = 3500) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms); }

const S = { info: null, project: null, data: null, tab: 'models', a: null, b: null, move: null, ref: null, image: null,
  jobs: [], openLogs: new Set() };
const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem('studio.' + k)) : localStorage.setItem('studio.' + k, v); } catch {} return v; };

// ---------------------------------------------------------------- reviews
const verdict = p => S.data.review[p]?.verdict;
async function review(path, patch) {
  const cur = S.data.review[path] || {};
  const next = {...cur, ...patch};
  S.data.review = await api('/api/review', {project: S.project, path, verdict: next.verdict || null, note: next.note || null});
  render();
}
function reviewControls(path) {
  const v = verdict(path);
  const note = h('input', {class: 'note', placeholder: 'note…', value: S.data.review[path]?.note || ''});
  note.addEventListener('change', () => review(path, {note: note.value}));
  return [
    h('button', {class: 'keep' + (v === 'keep' ? ' on' : ''), title: 'K', onclick: () => review(path, {verdict: v === 'keep' ? null : 'keep'})}, 'Keep'),
    h('button', {class: 'reject' + (v === 'reject' ? ' on' : ''), title: 'R', onclick: () => review(path, {verdict: v === 'reject' ? null : 'reject'})}, 'Reject'),
    note];
}
const shown = p => !($('#hideRejected').checked && verdict(p) === 'reject');
const winPath = p => S.info.distro ? `\\\\wsl.localhost\\${S.info.distro}${S.info.root}/outputs/${p}`.replaceAll('/', '\\') : `${S.info.root}/outputs/${p}`;
const copyBtn = p => h('button', {title: 'Copy the path to open it in Windows (Blender, Explorer)',
  onclick: () => navigator.clipboard.writeText(winPath(p)).then(() => toast('Copied ' + winPath(p)))}, 'Copy path');

// ---------------------------------------------------------------- models
function groupBy(items, key) { const g = {}; for (const i of items) (g[key(i)] ||= []).push(i); return g; }

function renderModels() {
  const list = $('#modelList'); list.replaceChildren();
  const models = S.data.models.filter(m => shown(m.path));
  const groups = groupBy(models, m => m.group);
  for (const g of Object.keys(groups).sort((x, y) => Math.max(...groups[y].map(m => m.mtime)) - Math.max(...groups[x].map(m => m.mtime)))) {
    list.append(h('h3', {}, g || '/'));
    for (const m of groups[g]) list.append(h('div', {
      class: 'item' + (S.a === m.path ? ' on' : '') + (S.b === m.path ? ' on b' : ''),
      onclick: e => { if (e.shiftKey && S.a && S.a !== m.path) S.b = S.b === m.path ? null : m.path; else { S.a = m.path; if (S.b === m.path) S.b = null; }
        store('model.' + S.project, S.a); renderModels(); }},
      h('span', {class: 'dot ' + (verdict(m.path) || '')}), h('span', {class: 't'}, m.name), h('small', {}, mb(m.size))));
  }
  if (!models.length) list.append(h('div', {class: 'empty'}, 'No models yet'));
  renderViewers();
}

let viewersKey = '';
function renderViewers() {
  const box = $('#viewers');
  const paths = [S.a, S.b].filter(Boolean);
  const key = paths.join('|');
  if (key === viewersKey && box.children.length) {  // keep the loaded models; refresh only the captions
    paths.forEach((p, i) => box.children[i].querySelector('.cap').replaceWith(viewerCap(p)));
    return;
  }
  viewersKey = key;
  box.replaceChildren();
  if (!paths.length) return box.append(h('div', {class: 'empty'}, 'Pick a model on the left'));
  const mvs = paths.map(p => {
    const mv = h('model-viewer', {src: file(p), 'camera-controls': true, 'shadow-intensity': '1', exposure: '1',
      'environment-image': 'neutral', autoplay: true, 'interaction-prompt': 'none', 'touch-action': 'pan-y'});
    box.append(h('div', {}, mv, viewerCap(p)));
    return mv;
  });
  if (mvs.length === 2) for (const [x, y] of [mvs, [...mvs].reverse()]) x.addEventListener('camera-change', e => {
    if (e.detail.source !== 'user-interaction') return;
    y.cameraOrbit = x.getCameraOrbit().toString(); y.cameraTarget = x.getCameraTarget().toString(); y.fieldOfView = x.getFieldOfView() + 'deg';
  });
}
function viewerCap(p) {
  const m = S.data.models.find(m => m.path === p) || {};
  return h('div', {class: 'cap'}, h('span', {class: 'path', title: p}, p, '  ·  ', mb(m.size || 0), '  ·  ', ago(m.mtime || 0)),
    copyBtn(p), ...reviewControls(p));
}

function renderImages() {
  const box = $('#images'); box.replaceChildren();
  for (const i of S.data.images) box.append(h('img', {src: file(i.path), title: i.path, class: S.image === i.path ? 'on' : '',
    onclick: () => { S.image = i.path; renderImages(); }}));
  if (!S.data.images.length) box.append(h('span', {class: 'meta'}, 'No images in this project yet: upload one.'));
}
$('#upload').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const project = $('#tProject').value.trim() || S.project;
  try {
    const up = await fetch(`/api/upload?project=${encodeURIComponent(project)}&name=${encodeURIComponent(f.name.replace(/[^A-Za-z0-9_.-]/g, '_'))}`, {method: 'POST', body: f});
    const i = await up.json(); if (!up.ok) throw new Error(i.error);
    S.image = i.path; toast('Uploaded ' + i.path);
    if (project !== S.project) await loadProjects(project); else await loadProject();
  } catch (err) { toast(err.message); }
});
$('#tGo').addEventListener('click', async () => {
  if (!S.image) return toast('Pick an image first');
  try {
    await api('/api/jobs/trellis', {project: $('#tProject').value.trim() || S.project, image: S.image, folder: $('#tFolder').value,
      pipeline: $('#tType').value, faces: $('#tFaces').value, texture: $('#tTex').value});
    toast('Queued: see Jobs'); pollJobs();
  } catch (err) { toast(err.message); }
});

// ---------------------------------------------------------------- clips
function moves() {
  const ms = [...S.data.moves];
  if (S.data.videos.length) ms.push({key: ':other', move: 'other clips', creature: '', prompt: '', clips: S.data.videos.map(v => ({...v, label: v.group + '/' + v.name.slice(0, -4)})), captures: [], other: true});
  return ms;
}
function renderMoves() {
  const list = $('#moveList'); list.replaceChildren();
  const ms = moves();
  if (!S.move || !ms.find(m => m.key === S.move)) S.move = ms[0]?.key;
  for (const [creature, group] of Object.entries(groupBy(ms, m => m.creature))) {
    list.append(h('h3', {}, creature || 'elsewhere'));
    for (const m of group) {
      const kept = m.clips.filter(c => verdict(c.path) === 'keep').length;
      list.append(h('div', {class: 'item' + (S.move === m.key ? ' on' : ''), onclick: () => { S.move = m.key; store('move.' + S.project, m.key); renderMoves(); }},
        h('span', {class: 'dot ' + (kept ? 'keep' : '')}), h('span', {class: 't'}, m.move),
        h('small', {}, m.clips.length + (kept ? ` · ${kept} kept` : ''))));
    }
  }
  if (S.data.creatures.length) list.append(h('div', {style: 'padding:10px 14px'}, h('button', {onclick: newMove}, '+ New move')));
  else list.append(h('div', {class: 'empty'}, 'No anymove creature (creature.json) in this project'));
  renderMove();
}
function newMove() {
  const name = prompt('Move name (letters, digits, - _ .)');
  if (!name) return;
  if (!/^[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(name)) return toast('Use letters, digits, - _ .');
  const creature = S.data.creatures[0];
  const base = S.data.moves.find(m => m.key === S.move);
  S.data.moves.unshift({key: `${creature}:${name}`, creature, move: name, prompt: base?.prompt || '', clips: [], captures: [], mtime: Date.now() / 1000});
  S.move = `${creature}:${name}`;
  renderMoves();
}

let renderedMove = '';
function renderMove() {
  const main = $('#moveMain');
  const m = moves().find(m => m.key === S.move);
  if (!m) return main.replaceChildren(h('div', {class: 'empty'}, 'No clips yet'));
  const sig = JSON.stringify([m, S.data.review, $('#hideRejected').checked]);
  if (sig === renderedMove) return;  // don't reload playing videos for nothing
  const keepPrompt = renderedMove && main.querySelector('#prompt')?.dataset.key === m.key ? main.querySelector('#prompt').value : null;
  renderedMove = sig;

  const clips = m.clips.filter(c => shown(c.path)).sort((x, y) => y.mtime - x.mtime);
  const videos = [];
  const clipCard = (c, capture) => {
    const v = h('video', {src: file(c.path), controls: true, preload: 'metadata', muted: true, loop: $('#loop')?.checked ?? true, playsinline: true});
    v.muted = true; v.dataset.fps = /14b/.test(c.path) ? 16 : 24;
    videos.push(v);
    const differs = !capture && c.prompt && m.prompt && c.prompt !== m.prompt;
    return h('div', {class: 'clip ' + (verdict(c.path) || '')}, v,
      h('div', {class: 'cap'},
        h('b', {}, c.label), c.job ? h('span', {class: 'badge'}, `${c.job.model} · seed ${c.job.seed}`) : null,
        differs ? h('span', {class: 'badge warn', title: c.prompt}, 'other prompt') : null,
        h('span', {class: 'meta'}, ago(c.mtime)), h('div', {class: 'spacer'}),
        c.log ? h('button', {onclick: () => showLog(c.log)}, 'Log') : null, copyBtn(c.path),
        ...reviewControls(c.path)),
      differs || (c.prompt && !m.prompt) ? h('details', {style: 'padding:0 10px 10px'}, h('summary', {}, 'prompt used'), h('pre', {}, c.prompt),
        h('button', {onclick: () => { $('#prompt').value = c.prompt; toast('Prompt loaded into the editor'); }}, 'Use this prompt')) : null);
  };

  const parts = [];
  if (!m.other) parts.push(generateCard(m, keepPrompt));
  parts.push(h('div', {class: 'toolbar'},
    h('button', {onclick: () => videos.forEach(v => { v.currentTime = 0; v.play(); })}, '▶ Play all from start'),
    h('button', {onclick: () => videos.forEach(v => v.paused ? v.play() : v.pause())}, 'Play / pause all'),
    h('button', {title: 'one frame back (,)', onclick: () => step(videos, -1)}, '◀ frame'),
    h('button', {title: 'one frame on (.)', onclick: () => step(videos, 1)}, 'frame ▶'),
    h('label', {class: 'inline'}, 'speed', h('select', {id: 'speed', onchange: e => videos.forEach(v => v.playbackRate = +e.target.value)},
      ...[0.25, 0.5, 1, 1.5].map(s => h('option', {value: s, selected: s === 1}, s + '×')))),
    h('label', {class: 'inline'}, h('input', {type: 'checkbox', id: 'loop', checked: true, onchange: e => videos.forEach(v => v.loop = e.target.checked)}), 'loop'),
    h('span', {class: 'meta'}, `${clips.length} clip${clips.length === 1 ? '' : 's'}`)));
  parts.push(clips.length ? h('div', {class: 'grid'}, clips.map(c => clipCard(c))) : h('div', {class: 'empty'}, 'No clips for this move yet'));
  if (m.captures.length) {
    parts.push(h('h2', {style: 'margin:24px 0 10px;font-size:14px'}, 'Captures'));
    const glbs = m.captures.filter(c => c.path.endsWith('.glb')), mp4s = m.captures.filter(c => c.path.endsWith('.mp4'));
    parts.push(h('div', {class: 'grid'}, mp4s.map(c => clipCard(c, true)),
      glbs.map(c => h('div', {class: 'clip'}, h('model-viewer', {src: file(c.path), 'camera-controls': true, autoplay: true,
        'environment-image': 'neutral', 'shadow-intensity': '1', style: 'aspect-ratio:16/9;height:auto'}),
        h('div', {class: 'cap'}, h('b', {}, c.label), h('div', {class: 'spacer'}), copyBtn(c.path), ...reviewControls(c.path))))));
  }
  main.replaceChildren(...parts);
  main.videos = videos;
}
function step(videos, n) { videos.forEach(v => { v.pause(); v.currentTime = Math.max(0, v.currentTime + n / v.dataset.fps); }); }

function generateCard(m, keepPrompt) {
  const refs = S.data.refs.filter(r => r.path.startsWith(m.creature + '/'));
  if (!refs.find(r => r.path === S.ref)) S.ref = refs[0]?.path;
  const refBox = h('div', {class: 'refs'});
  const drawRefs = () => refBox.replaceChildren(...refs.map(r => h('img', {src: file(r.path), title: r.path, class: S.ref === r.path ? 'on' : '',
    onclick: () => { S.ref = r.path; drawRefs(); }})));
  drawRefs();
  const ta = h('textarea', {id: 'prompt', rows: 7, 'data-key': m.key});
  ta.value = keepPrompt ?? m.prompt;
  const seeds = h('input', {placeholder: 'random', size: 10, title: 'one clip per seed: 1,2,3'});
  const model = h('select', {}, ...S.info.wan_models.map(x => h('option', {}, x)));
  const seconds = h('input', {type: 'number', value: 5, min: 1, max: 10, style: 'width:60px'});
  const steps = h('input', {type: 'number', placeholder: 'default', style: 'width:80px'});
  const save = h('input', {type: 'checkbox', checked: true});
  const go = async () => {
    if (!S.ref) return toast('This creature has no reference frame (runs/ref*/ref.png) yet');
    try {
      const made = await api('/api/jobs/wan', {project: S.project, creature: m.creature, move: m.move, prompt: ta.value, ref: S.ref,
        model: model.value, seeds: seeds.value, seconds: seconds.value, steps: steps.value, save_prompt: save.checked});
      toast(`Queued ${made.length} clip${made.length > 1 ? 's' : ''}: see Jobs`); pollJobs();
      if (save.checked) { m.prompt = ta.value.trim(); }
    } catch (err) { toast(err.message); }
  };
  return h('div', {class: 'card'},
    h('h2', {}, m.move, ' ', h('span', {class: 'meta'}, m.creature + '/prompts/' + m.move + '.txt')),
    ta,
    h('div', {class: 'row', style: 'margin-top:10px'},
      h('label', {}, 'Reference frame', refBox),
      h('label', {}, 'Model', model), h('label', {}, 'Seeds', seeds), h('label', {}, 'Seconds', seconds), h('label', {}, 'Steps', steps),
      h('label', {class: 'inline'}, save, 'save as the move\'s prompt'),
      h('button', {class: 'primary', onclick: go}, 'Generate')));
}

// ---------------------------------------------------------------- jobs
async function pollJobs() {
  clearTimeout(pollJobs.t);
  try {
    const before = Object.fromEntries(S.jobs.map(j => [j.id, j.status]));
    S.jobs = await api('/api/jobs');
    const active = S.jobs.filter(j => j.status === 'running' || j.status === 'queued').length;
    $('#jobcount').textContent = active || '';
    if (S.jobs.some(j => before[j.id] && before[j.id] !== j.status && j.status === 'done' && j.project === S.project)) loadProject();
    if (S.tab === 'jobs') renderJobs();
    pollJobs.t = setTimeout(pollJobs, active || S.tab === 'jobs' ? 2000 : 10000);
  } catch { pollJobs.t = setTimeout(pollJobs, 5000); }
}
function renderJobs() {
  const main = $('#jobList');
  if (!S.jobs.length) return main.replaceChildren(h('div', {class: 'empty'}, 'No jobs yet. Queue one from Models or Clips.'));
  main.replaceChildren(...S.jobs.map(j => {
    const t = j.started ? Math.round(((j.ended || Date.now() / 1000) - j.started) / 60) + ' min' : '';
    const pct = j.status === 'done' ? 100 : j.steps ? 100 * j.steps[0] / j.steps[1] : 0;
    const open = S.openLogs.has(j.id);
    return h('div', {class: 'card job'},
      h('span', {class: 'status ' + j.status}, j.status),
      h('div', {}, h('b', {}, j.label), h('div', {class: 'meta'}, j.out, ' · ', ago(j.created), t && ' · ' + t,
        j.steps && j.status === 'running' ? ` · step ${j.steps[0]}/${j.steps[1]}` : '')),
      h('div', {class: 'row'},
        h('button', {onclick: () => { open ? S.openLogs.delete(j.id) : S.openLogs.add(j.id); renderJobs(); }}, open ? 'Hide log' : 'Log'),
        ['queued', 'running'].includes(j.status) ? h('button', {class: 'reject', onclick: () => api('/api/jobs/cancel', {id: j.id}).then(pollJobs)}, 'Cancel') : null),
      j.status === 'running' ? h('div', {class: 'bar'}, h('div', {style: `width:${pct}%`})) : null,
      open ? h('pre', {style: 'grid-column:1/4'}, j.tail) : null);
  }));
}
async function showLog(path) {
  const {text} = await api('/api/log?path=' + encodeURIComponent(path));
  const pre = h('pre', {style: 'max-height:70vh'}, text);
  const dlg = h('dialog', {style: 'width:min(900px,95vw);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px'},
    h('div', {class: 'row'}, h('b', {style: 'flex:1'}, path), h('button', {onclick: () => dlg.close()}, 'Close')), pre);
  dlg.addEventListener('close', () => dlg.remove());
  document.body.append(dlg); dlg.showModal(); pre.scrollTop = pre.scrollHeight;
}

// ---------------------------------------------------------------- wiring
function render() {
  if (!S.data) return;
  if (S.tab === 'models') { renderModels(); renderImages(); }
  if (S.tab === 'clips') renderMoves();
  if (S.tab === 'jobs') renderJobs();
}
function setTab(tab) {
  S.tab = tab; store('tab', tab);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === tab));
  render(); pollJobs();
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#hideRejected').addEventListener('change', render);
$('#project').addEventListener('change', e => { S.project = e.target.value; store('project', S.project); loadProject(true); });
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (S.tab === 'models' && S.a && (e.key === 'k' || e.key === 'r')) review(S.a, {verdict: e.key === 'k' ? (verdict(S.a) === 'keep' ? null : 'keep') : (verdict(S.a) === 'reject' ? null : 'reject')});
  const vids = $('#moveMain').videos || [];
  if (S.tab === 'clips' && e.key === ' ') { e.preventDefault(); vids.forEach(v => v.paused ? v.play() : v.pause()); }
  if (S.tab === 'clips' && (e.key === ',' || e.key === '.')) step(vids, e.key === '.' ? 1 : -1);
});

async function loadProject(fresh) {
  const data = await api('/api/project?name=' + encodeURIComponent(S.project));
  S.data = data;
  if (fresh) { S.a = store('model.' + S.project); S.b = null; S.move = store('move.' + S.project); S.image = null; renderedMove = ''; viewersKey = ''; }
  if (!data.models.find(m => m.path === S.a)) S.a = [...data.models].sort((x, y) => y.mtime - x.mtime)[0]?.path || null;
  $('#tProject').value = S.project;
  render();
}
async function loadProjects(select) {
  S.info = await api('/api/projects');
  const sel = $('#project');
  sel.replaceChildren(...S.info.projects.map(p => h('option', {}, p)));
  S.project = select || (S.info.projects.includes(store('project')) ? store('project') : S.info.projects.includes('rogue') ? 'rogue' : S.info.projects[0]);
  sel.value = S.project;
  $('#tType').replaceChildren(...S.info.trellis_types.map(t => h('option', {}, t)));
  if (S.project) await loadProject(true);
}
loadProjects().then(() => setTab(store('tab') || 'models'));
</script>
</body>
