<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Studio</title>
<link rel="icon" href="data:,">
<script type="importmap">
{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
             "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root {
  --bg: #15171a; --panel: #1d2024; --raised: #262a2f; --line: #33383e; --text: #e4e6e9; --dim: #959ba3;
  --accent: #6ea8ff; --keep: #4cc38a; --reject: #ec6a5e; --warn: #e0b341;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; height: 100vh;
  display: flex; flex-direction: column; }
header { display: flex; gap: 16px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line);
  background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
nav button { background: none; border: none; color: var(--dim); padding: 6px 10px; font: inherit; cursor: pointer;
  border-bottom: 2px solid transparent; }
nav button.on { color: var(--text); border-color: var(--accent); }
.spacer { flex: 1; }
select, input, textarea, button { font: inherit; color: var(--text); background: var(--raised);
  border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; }
textarea { width: 100%; resize: vertical; }
button { cursor: pointer; }
button.chip { font-size: 11px; padding: 2px 7px; border-radius: 10px; }
button:hover { border-color: var(--dim); }
button.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
button.keep.on { background: var(--keep); color: #04140c; border-color: var(--keep); }
button.reject.on { background: var(--reject); color: #1a0503; border-color: var(--reject); }
label { color: var(--dim); font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
label.inline { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; }
.view { flex: 1; display: none; min-height: 0; }
.view.on { display: flex; }
aside { width: 280px; flex: none; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel);
  padding: 8px 0; }
aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 12px 14px 4px; }
.item { padding: 6px 14px; cursor: pointer; display: flex; gap: 8px; align-items: center; border-left: 3px solid transparent; }
.item:hover { background: var(--raised); }
.item.on { background: var(--raised); border-left-color: var(--accent); }
.item.b { border-left-color: var(--warn); }
.item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item small, .meta { color: var(--dim); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: transparent; }
.dot.keep { background: var(--keep); } .dot.reject { background: var(--reject); }
main { flex: 1; overflow-y: auto; padding: 16px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.viewers { display: flex; gap: 10px; height: 62vh; }
.viewers > div { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
model-viewer { width: 100%; flex: 1; background: radial-gradient(#2b3037, #15171a); --poster-color: transparent; }
.cap { padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); }
.cap .path { flex: 1; min-width: 120px; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.note { flex-basis: 100%; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
.card h2 { font-size: 14px; margin: 0 0 10px; }
details > summary { cursor: pointer; color: var(--dim); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 12px; }
.clip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.clip.keep { border-color: var(--keep); } .clip.reject { opacity: .55; }
.clip.picked { outline: 2px solid var(--accent); outline-offset: -2px; }
.cappick { width: 16px; height: 16px; cursor: pointer; }
.selbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.clip video { width: 100%; display: block; background: #000; aspect-ratio: 16 / 9; }
.clip .cap { border: none; }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--raised); color: var(--dim); }
.badge.warn { color: var(--warn); }
.toolbar { position: sticky; top: -16px; z-index: 2; background: var(--bg); padding: 8px 0; display: flex; gap: 6px;
  align-items: center; flex-wrap: wrap; }
.refs { display: flex; gap: 8px; flex-wrap: wrap; }
.refs img { height: 72px; border: 2px solid var(--line); border-radius: 5px; cursor: pointer; background: #000; }
.refs img.on { border-color: var(--accent); }
pre { background: #0e1012; padding: 10px; border-radius: 6px; overflow: auto; max-height: 340px; font-size: 12px;
  white-space: pre-wrap; margin: 6px 0 0; }
.job { display: grid; grid-template-columns: 110px 1fr auto; gap: 4px 12px; align-items: center; }
.job.picked { outline: 1px solid var(--accent); }
.jobpick { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.jobsbar { position: sticky; top: 0; z-index: 2; gap: 8px; flex-wrap: wrap; }
.status { font-size: 12px; font-weight: 600; text-transform: uppercase; }
.status.running { color: var(--accent); } .status.done { color: var(--keep); } .status.failed, .status.interrupted { color: var(--reject); }
.status.queued, .status.cancelled { color: var(--dim); }
.bar { height: 4px; background: var(--raised); border-radius: 2px; grid-column: 2 / 4; }
.bar > div { height: 100%; background: var(--accent); border-radius: 2px; }
.empty { color: var(--dim); padding: 40px; text-align: center; }
.dot.good { background: var(--keep); } .dot.minor { background: var(--warn); } .dot.bad { background: var(--reject); }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 640px), 1fr)); }  /* two captures a row on a wide screen */
.pair { display: flex; background: #000; } .pair > * { flex: 1; min-width: 0; }
.pair video { aspect-ratio: 16 / 9; height: auto; }
.badge.verdict.good { color: var(--keep); } .badge.verdict.minor { color: var(--warn); } .badge.verdict.bad { color: var(--reject); }
.timeline { position: relative; height: 26px; background: #0e1012; border-top: 1px solid var(--line); cursor: pointer; }
.timeline .seg { position: absolute; border-radius: 2px; opacity: .85; min-height: 4px; }
.timeline .seg:hover { opacity: 1; outline: 1px solid var(--text); }
.timeline .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); pointer-events: none; }
.seg.video, .stage.video { --c: #e0b341; } .seg.reading, .stage.reading { --c: #6ea8ff; } .seg.fit, .stage.fit { --c: #b48cff; }
.seg.skin, .stage.skin { --c: #ec6a5e; } .seg.rig, .stage.rig { --c: #ff8a3d; }
.timeline .seg { background: var(--c); }
.issues { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.issues-wrap { padding: 0 10px 10px; } .issues-wrap > summary { color: var(--dim); font-size: 13px; padding: 4px 0; }
.issues-wrap .issues { padding: 8px 0 0; }
.stage-head { align-items: center; gap: 8px; margin-bottom: 2px; } .stage-head .stage { margin: 0; }
.stage { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--c); margin-bottom: 2px; }
.issue { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
.issue .when { padding: 1px 6px; font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
.issue .what { flex: 1; font-size: 13px; } .issue .what.minor, .issue .what.note { color: var(--dim); }
.issue .what.note::before { content: 'note: '; }
button.fix { font-size: 12px; padding: 3px 8px; border-color: var(--accent); color: var(--accent); flex: none; }
.dlg { width: min(760px, 95vw); background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
.dlg::backdrop { background: rgba(0, 0, 0, .6); }
#toast { position: fixed; bottom: 16px; right: 16px; background: var(--raised); border: 1px solid var(--line);
  padding: 10px 14px; border-radius: 6px; display: none; max-width: 420px; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.vcard { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.vcard.approved { border-color: var(--keep); } .vcard.missing { border-style: dashed; }
.vcard > img { width: 100%; aspect-ratio: 3 / 4; object-fit: contain; background: #0e1012; display: block; cursor: zoom-in; }
.vcard .hole { aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center; color: var(--dim); background: #0e1012; }
.vcard .cap input.words { flex: 1; min-width: 120px; }
.history { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 10px 10px; }
.history img { height: 56px; border: 1px solid var(--line); border-radius: 4px; cursor: zoom-in; background: #000; }
button.warn { border-color: var(--warn); }
button:disabled { opacity: .45; cursor: default; }
@media (max-width: 760px) { .view.on { flex-direction: column; } aside { width: auto; max-height: 30vh; border-right: none; }
  .viewers { flex-direction: column; height: auto; } .viewers > div { height: 55vh; } }
</style>
</head>
<body>
<header>
  <h1>Character Studio</h1>
  <select id="project"></select>
  <nav>
    <button data-tab="views" class="on">Views</button>
    <button data-tab="models">Models</button>
    <button data-tab="clips">Clips</button>
    <button data-tab="motion">Motion</button>
    <button data-tab="jobs">Jobs <span id="jobcount" class="badge"></span></button>
  </nav>
  <div class="spacer"></div>
  <label class="inline"><input type="checkbox" id="hideRejected"> hide rejected</label>
  <button id="deleteRejected" title="every clip and capture marked Reject goes to the character's .trash folder">Delete rejected</button>
</header>

<section class="view" id="models">
  <aside id="modelList"></aside>
  <main>
    <div class="viewers" id="viewers"></div>
    <p class="meta">Click a model to view it; Shift-click another to compare side by side (cameras move together).
      Keys: K keep, R reject. Ctrl + wheel zooms a 3D view; the wheel alone scrolls the page.</p>
    <!-- the TRELLIS settings, shown in the Views tab (kept here, hidden, so they survive its redraws) -->
    <div hidden>
      <div class="row" id="tSettings">
        <label>Folder <input id="tFolder" size="12" placeholder="pipeline type"></label>
        <label>Pipeline <select id="tType"></select></label>
        <label>Faces <input id="tFaces" type="number" value="200000" step="10000" style="width:100px"></label>
        <label>Texture <select id="tTex"><option>1024</option><option selected>2048</option><option>4096</option></select></label>
        <label title="Also make a copy painted with the views' own pixels (reference/reproject.py): sharp faces, trims and buckles where the front and back views see, at the views' colours. ~30 s. Both models are kept to compare."><input id="tPaint" type="checkbox" checked> Paint from views</label>
      </div>
    </div>
  </main>
</section>

<section class="view on" id="views">
  <main id="viewsMain"></main>
</section>

<section class="view" id="clips">
  <aside id="moveList"></aside>
  <main id="moveMain"></main>
</section>

<section class="view" id="jobs">
  <main id="jobList"></main>
</section>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', body: body instanceof Blob ? body : JSON.stringify(body)});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
};
const inChar = p => p.startsWith(S.project + '/') ? p.slice(S.project.length + 1) : p;
const file = p => '/files/' + p.split('/').map(encodeURIComponent).join('/');
const mb = n => (n / 2 ** 20).toFixed(n > 2 ** 24 ? 0 : 1) + ' MB';
const ago = t => { const s = Date.now() / 1000 - t; return s < 3600 ? Math.round(s / 60) + ' min ago' :
  s < 86400 ? Math.round(s / 3600) + ' h ago' : new Date(t * 1000).toLocaleDateString(); };
function toast(msg, ms = 3500) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms); }

const S = { info: null, project: null, data: null, tab: 'views', a: null, b: null, move: null, ref: null,
  jobs: [], openLogs: new Set(), jobSel: new Set(), capSel: new Set() };
const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem('studio.' + k)) : localStorage.setItem('studio.' + k, v); } catch {} return v; };

// ---------------------------------------------------------------- reviews
const verdict = p => S.data.review[p]?.verdict;
async function review(path, patch) {
  const cur = S.data.review[path] || {};
  const next = {...cur, ...patch};
  S.data.review = await api('/api/review', {project: S.project, path, verdict: next.verdict || null, note: next.note || null});
  render();
}
function reviewControls(path) {
  const v = verdict(path);
  const note = h('input', {class: 'note', placeholder: 'note…', value: S.data.review[path]?.note || ''});
  note.addEventListener('change', () => review(path, {note: note.value}));
  return [
    h('button', {class: 'keep' + (v === 'keep' ? ' on' : ''), title: 'K', onclick: () => review(path, {verdict: v === 'keep' ? null : 'keep'})}, 'Keep'),
    h('button', {class: 'reject' + (v === 'reject' ? ' on' : ''), title: 'R', onclick: () => review(path, {verdict: v === 'reject' ? null : 'reject'})}, 'Reject'),
    note];
}
const shown = p => !($('#hideRejected').checked && verdict(p) === 'reject');
const winPath = p => S.info.distro ? `\\\\wsl.localhost\\${S.info.distro}${S.info.root}/outputs/${p}`.replaceAll('/', '\\') : `${S.info.root}/outputs/${p}`;
const copyBtn = p => h('button', {title: 'Copy the path to open it in Windows (Blender, Explorer)',
  onclick: () => navigator.clipboard.writeText(winPath(p)).then(() => toast('Copied ' + winPath(p)))}, 'Copy path');

// deleting moves things to <project>/.trash/<time>/ (never erased): move them back to restore
async function trash(items, what) {
  if (!items.length) return toast('Nothing to delete');
  if (!confirm(`Move ${what} to the trash?\n\nThe files go to ${S.project}/.trash/ in outputs, so they can be put back.`)) return;
  try {
    let r = await api('/api/delete', {project: S.project, items});
    if (r.busy) {  // jobs still queued or running on these: offer to cancel them rather than refuse
      const list = r.busy.slice(0, 8).map(j => `• ${j.label} (${j.status}${j.auto ? ', automatic' : ''})`).join('\n')
        + (r.busy.length > 8 ? `\n… and ${r.busy.length - 8} more` : '');
      if (!confirm(`${r.busy.length} job${r.busy.length === 1 ? ' works' : 's work'} on what you're deleting:\n\n${list}\n\nCancel ${r.busy.length === 1 ? 'it' : 'them'} and delete?`)) return;
      r = await api('/api/delete', {project: S.project, items, cancel_jobs: true});
      pollJobs();
    }
    toast(`Moved ${r.moved.length} item${r.moved.length === 1 ? '' : 's'} to ${r.trash}` + (r.cancelled ? ` · cancelled ${r.cancelled} job${r.cancelled === 1 ? '' : 's'}` : ''), 6000);
    renderedMove = ''; await loadProject();
    return true;
  } catch (err) { toast(err.message, 6000); }
}
const delBtn = (items, what) => h('button', {class: 'reject', title: 'move it to the character\'s .trash folder', onclick: () => trash(items, what)}, 'Delete');

// ---------------------------------------------------------------- models
function groupBy(items, key) { const g = {}; for (const i of items) (g[key(i)] ||= []).push(i); return g; }

const SET_NAMES = {front: 'front', front_34: 'front + 3/4', front_side: 'front + side', four: 'front, left, back, right',
  both_34: 'front + both 3/4s', eight: 'eight views', turntable: 'turntable'};
function madeFrom(m) {  // what a TRELLIS run was made from (its views.json), in a few words
  const r = m?.made_from;
  if (r?.set) return (SET_NAMES[r.set] || r.set) + ' · views ' + Object.entries(r.versions || {}).map(([v, n]) => `${v} v${n ?? '?'}`).join(', ');
  if (r?.image) return 'one image: ' + (r.view || r.image.split('/').pop());
  return null;
}
function renderModels() {
  const list = $('#modelList'); list.replaceChildren();
  const showRaw = store('showRaw') === '1';
  list.append(h('label', {class: 'inline', style: 'padding:8px 14px', title: "TRELLIS's untextured mesh, a by-product of each run's textured model"},
    h('input', {type: 'checkbox', checked: showRaw, onchange: e => { store('showRaw', e.target.checked ? '1' : '0'); renderModels(); }}),
    'show untextured meshes'));
  const models = S.data.models.filter(m => shown(m.path) && (showRaw || !m.raw));
  const groups = groupBy(models, m => m.group);
  for (const g of Object.keys(groups).sort((x, y) => Math.max(...groups[y].map(m => m.mtime)) - Math.max(...groups[x].map(m => m.mtime)))) {
    const src = madeFrom(groups[g].find(m => m.made_from));
    const copy = groups[g].find(m => m.rig_copy);
    list.append(h('h3', {title: src || ''}, g || '/', src ? h('div', {class: 'meta', style: 'text-transform:none;font-weight:normal;letter-spacing:0'}, src) : null,
      copy ? h('div', {class: 'meta', style: 'text-transform:none;font-weight:normal;letter-spacing:0'},
        "the rig's mesh" + (typeof copy.rig_copy === 'string' ? ': a copy of ' + inChar(copy.rig_copy).split('/').slice(0, -1).join('/') : '')) : null));
    for (const m of groups[g]) list.append(h('div', {
      class: 'item' + (S.a === m.path ? ' on' : '') + (S.b === m.path ? ' on b' : ''),
      onclick: e => { if (e.shiftKey && S.a && S.a !== m.path) S.b = S.b === m.path ? null : m.path; else { S.a = m.path; if (S.b === m.path) S.b = null; }
        store('model.' + S.project, S.a); renderModels(); }},
      h('span', {class: 'dot ' + (verdict(m.path) || '')}), h('span', {class: 't'}, m.name),
      m.rig_source ? h('span', {class: 'badge', title: "the current rig was made from this model (rigging/promote.json)"}, 'rig') : null,
      m.rig_paint === 'wears' && !m.rig_source ? h('span', {class: 'badge', title: "the rig wears this model's texture (rigging/retexture.py)"}, 'rig paint') : null,
      h('small', {}, mb(m.size))));
  }
  if (!models.length) list.append(h('div', {class: 'empty'}, 'No models yet'));
  renderViewers();
}

let viewersKey = '';
function renderViewers() {
  const box = $('#viewers');
  const paths = [S.a, S.b].filter(Boolean);
  const key = paths.join('|');
  if (key === viewersKey && box.children.length) {  // keep the loaded models; refresh only the captions
    paths.forEach((p, i) => box.children[i].querySelector('.cap').replaceWith(viewerCap(p)));
    return;
  }
  viewersKey = key;
  box.replaceChildren();
  if (!paths.length) return box.append(h('div', {class: 'empty'}, 'Pick a model on the left'));
  const mvs = paths.map(p => {
    const mv = h('model-viewer', {src: file(p), 'camera-controls': true, 'shadow-intensity': '1', exposure: '1',
      'environment-image': 'neutral', autoplay: true, 'interaction-prompt': 'none', 'touch-action': 'pan-y'});
    box.append(h('div', {}, mv, viewerCap(p)));
    return mv;
  });
  if (mvs.length === 2) for (const [x, y] of [mvs, [...mvs].reverse()]) x.addEventListener('camera-change', e => {
    if (e.detail.source !== 'user-interaction') return;
    y.cameraOrbit = x.getCameraOrbit().toString(); y.cameraTarget = x.getCameraTarget().toString(); y.fieldOfView = x.getFieldOfView() + 'deg';
  });
}
function viewerCap(p) {
  const m = S.data.models.find(m => m.path === p) || {};
  const inProject = inChar(p).split('/')[0];  // anymove/, rigging/, archive/: already rigged or replaced
  const item = isItem(S.project) ? S.data.item || {} : null;
  const forItem = item && !['game', 'anymove', 'rigging', 'archive'].includes(inProject) ? [h('button', {
    title: "Estimate this model's grip and bake a light copy of it (5,000 faces, a 1024 texture) for the equip preview and the game (rigging/item_game.py)",
    onclick: async () => {
      const len = prompt('Real length of the item in metres (TRELLIS makes every model about one unit long). Leave empty to keep ' +
        (item.length_m ? item.length_m + ' m' : 'it unscaled') + '.', item.length_m || '');
      if (len === null) return;
      if (len && !(+len > 0)) return toast('A length in metres, like 0.6');
      try { await api('/api/jobs/item', {project: S.project, model: p, length_m: len ? +len : undefined}); toast('Queued: see Jobs'); pollJobs(); }
      catch (err) { toast(err.message, 6000); }
    }}, item.model && p.endsWith('/' + item.model) ? 'Used for the item (again…)' : 'Use for the item')] : [];
  const promote = item || ['anymove', 'rigging', 'archive'].includes(inProject) ? forItem : [h('button', {
    title: "Prep this model into the character's anymove/ and rig it into rigging/ (rigging/promote.py). The current mesh, rig " +
           'and captures move to archive/ first.',
    onclick: async () => {
      if (!confirm(`Rig ${p} as this character's mesh?\n\nThe current mesh, rig and captures move to ${S.project}/archive/ ` +
                   '(nothing is deleted). Prompts and settings carry over. It takes a few minutes on the GPU.')) return;
      try { await api('/api/jobs/promote', {project: S.project, model: p}); toast('Queued: see Jobs'); pollJobs(); }
      catch (err) { toast(err.message); }
    }}, 'Use for the rig')];

// A move's Kimodo recipe (anymove/prompts/<move>.kimodo.json, rigging/kimodo_capture.py --recipe): the prompt plus
// keyframes pinned from other Kimodo captures, for moves words alone don't get (a jump into a twirl into a lunge).
const RECIPE_HELP = `Keys: "prompt", "duration", "samples"; "poses": [{"at": seconds or "end", "from": "CAPTURE:FRAME",
  "arms"/"legs": "CAPTURE:FRAME" (take them from another frame; a list applies in order, and "CAPTURE:FRAME*0.5"
  goes only half way there, e.g. arms half spread), "facing": degrees, "hips": metres, "straight": true
  (knees), "upright": true (spine)}]; "headings": [{"at", "facing"}]; "jump": {"apex": s, "hips": m at the top,
  "every": frames, "forward": metres travelled, "crouch": {pose}, "spin": {"turns", "seconds", "start": s from takeoff (negative: spins as
  it pushes off)}, "pose": {pose held in the air},
  "release": {"arms": "CAPTURE:FRAME", "seconds": 0.2, "legs": "CAPTURE:FRAME*0.45", "legs_seconds": 0.25} (the air pose's
  arms whip into these, and its legs reach for these, just before touchdown)}.
Make the key poses as moves of their own first (a landing, a stance), then pin them here. Click a capture below to insert it.`;
function recipeBox(m, text, dur, n, seed) {
  const project = S.project;
  const ta = h('textarea', {rows: 14, spellcheck: false, style: 'width:100%;font-family:monospace;font-size:12px'});
  const where = h('span', {class: 'meta'});
  const chips = h('div', {class: 'row', style: 'flex-wrap:wrap;gap:4px;margin-top:6px'});
  const insert = name => {
    const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a;
    ta.value = ta.value.slice(0, a) + name + ta.value.slice(b);
    ta.focus(); ta.selectionStart = ta.selectionEnd = a + name.length;
  };
  const starter = () => JSON.stringify({prompt: text.value.trim() || 'A person ...', duration: Number(dur.value) || 3,
    samples: Number(n.value) || 4, poses: [{at: 'end', from: 'CAPTURE:FRAME'}]}, null, 1);
  api(`/api/kimodo_recipe?project=${encodeURIComponent(project)}&move=${encodeURIComponent(m.move)}`).then(r => {
    ta.value = r.text ?? '';
    where.textContent = r.text ? r.path : 'no recipe yet: "Start one" fills in the prompt above';
    chips.replaceChildren(...r.sources.map(c => h('button', {class: 'chip', title: 'insert at the cursor; add :FRAME for a frame (default: the last)',
      onclick: () => insert(c)}, c)));
  }).catch(err => where.textContent = err.message);
  const save = async () => {
    const r = await api('/api/kimodo_recipe', {project, move: m.move, text: ta.value});
    ta.value = r.text; where.textContent = 'saved: ' + r.path;
  };
  return h('details', {style: 'margin-top:10px', open: false},
    h('summary', {}, 'Keyframes (recipe)'),
    h('pre', {class: 'meta', style: 'white-space:pre-wrap;margin:6px 0'}, RECIPE_HELP),
    ta, where, chips,
    h('div', {class: 'row', style: 'margin-top:8px'},
      h('button', {onclick: () => { if (!ta.value.trim() || confirm('Replace the recipe with a new one?')) ta.value = starter(); }}, 'Start one'),
      h('button', {onclick: async () => { try { await save(); toast('Recipe saved'); } catch (err) { toast(err.message); } }}, 'Save'),
      h('div', {class: 'spacer'}),
      h('button', {class: 'primary', title: 'saves the recipe, then runs Kimodo with its prompt, length, samples and keyframes; the seed is the one above',
        onclick: async () => {
          try { await save();
                await offerCancelChecks(project, m.move);
                await api('/api/jobs/kimodo', {project, move: m.move, recipe: true, seed: seed.value});
                toast('Queued: see Jobs'); pollJobs(); } catch (err) { toast(err.message); }
        }}, 'Generate from recipe')));
}

// ---------------------------------------------------------------- what the checks found
const STAGES = {video: 'the Wan clip', reading: 'reading the clip', fit: 'fitting the rig', skin: 'the skin', rig: 'the rig'};
const fmt = t => t.toFixed(2) + ' s';
function verdictBadge(check, checkable = true, checking = false) {
  if (!check) return checkable ? h('span', {class: 'badge', title: 'the checks run by themselves; see Jobs'}, 'checking…') : null;
  const n = check.issues.filter(i => i.severity !== 'note').length;
  const tip = 'score out of 100: each problem costs its share of the clip, video problems most, a limb hidden in one view least' +
    (check.from_capture ? `; found while capturing ${check.from_capture}` : '');
  return h('span', {class: 'badge verdict ' + check.verdict, title: tip},
    `${check.score ?? '?'} · `, n ? `${n} problem${n > 1 ? 's' : ''}` : 'no problems', checking ? ' · rechecking' : '');
}
function timeline(check, video, seek) {
  const d = check.duration || video?.duration || 1;
  const bar = h('div', {class: 'timeline', title: 'problems over time; click one to jump there'});
  const lanes = [...new Set(check.issues.map(i => i.limb))];
  check.issues.forEach(i => bar.append(h('div', {class: 'seg ' + i.stage, title: `${fmt(i.t0)}–${fmt(i.t1)} · ${i.limb}: ${i.what}`,
    style: `left:${100 * i.t0 / d}%;width:${Math.max(0.8, 100 * (i.t1 - i.t0) / d)}%;top:${4 + 100 * lanes.indexOf(i.limb) / Math.max(lanes.length, 1) * 0.8}%;height:${80 / Math.max(lanes.length, 1)}%`,
    onclick: () => seek(i.peak_t)})));
  const head = h('div', {class: 'playhead'});
  bar.append(head);
  if (video) video.addEventListener('timeupdate', () => head.style.left = `${100 * video.currentTime / d}%`);
  return bar;
}
const ORDER = ['video', 'reading', 'fit', 'skin', 'rig'];  // the pipeline's order: an earlier stage's problem spoils the rest
function issueList(check, seek, ctx) {
  if (!check.issues.length) return null;
  const byStage = groupBy(check.issues, i => i.stage);
  const stages = ORDER.filter(s => byStage[s]);
  const upstream = byStage.video?.some(i => i.severity === 'major');
  // a capture made from words has no clip: what the checks file under "video" is in the motion Kimodo made
  const kimodo = !!ctx.capture?.kimodo;
  const body = h('div', {class: 'issues'},
    upstream && stages.length > 1 ? h('p', {class: 'meta', style: 'margin:0'}, kimodo ?
      'Start with the motion: the skin and rig can only look as good as the movement they follow.' :
      'Start with the Wan clip: the later stages can only be as good as the video they read.') : null,
    stages.map(stage => {
      const list = byStage[stage];
      // one button per fix, covering every problem it addresses
      const offers = list.flatMap(i => [i.fix, i.alt].filter(Boolean).map(fix => ({...i, fix})));  // alt: a second way out
      const fixes = Object.values(groupBy(offers, i => i.fix.action + (i.fix.solve || '')));
      return h('div', {},
        h('div', {class: 'row stage-head'}, h('div', {class: 'stage ' + stage}, 'From ' + (kimodo && stage === 'video' ? 'the motion (Kimodo)' : STAGES[stage])),
          ...fixes.map(group => fixButton(group, ctx))),
        list.map(i => h('div', {class: 'issue'},
          h('button', {class: 'when', title: 'jump there', onclick: () => seek(i.peak_t)}, fmt(i.t0) + (i.t1 - i.t0 > 0.1 ? '–' + fmt(i.t1) : '')),
          h('span', {class: 'what ' + i.severity}, i.what))));
    }));
  if (!check.from_capture) return body;
  return h('details', {class: 'issues-wrap'}, h('summary', {}, `Found while capturing ${check.from_capture} (fixes are on the capture below)`), body);
}
const fixed = new Set();
function fixButton(group, ctx) {
  const f = group[0].fix;
  if (ctx.capture?.kimodo && f.action === 'regenerate')  // no clip to make again: a new seed, or new words, in the Kimodo card
    return h('button', {class: 'fix', title: 'opens the Kimodo card above with this prompt and a new seed', onclick: () => {
      const card = $('#kimodoCard'); if (!card) return;
      card.open = true; $('#kimodoText').value = ctx.capture.kimodo; $('#kimodoSeed').value = Math.floor(Math.random() * 1000);
      card.scrollIntoView({behavior: 'smooth', block: 'start'}); $('#kimodoText').focus();
    }}, 'Try another seed or prompt');
  const id = JSON.stringify([ctx.clip?.path || ctx.capture?.dir, f.action, f.solve]);
  if (fixed.has(id)) return h('span', {class: 'meta'}, 'queued');
  const label = f.action === 'regenerate' ? (group.some(i => i.fix.prompt_add) ? 'Generate again with fixes in the prompt' : 'Generate again with new seeds') :
    f.action === 'rig_task' && group.length > 1 ? `Add these ${group.length} to the rig to-do list` : f.label;
  return h('button', {class: 'fix', title: [...new Set(group.map(i => i.fix.prompt_add || i.fix.solve).filter(Boolean))].join('\n'),
    onclick: async e => {
      try {
        const ok = await applyFix(group, ctx);
        if (ok !== false) { fixed.add(id); e.target.replaceWith(h('span', {class: 'meta'}, 'queued')); pollJobs(); }
      } catch (err) { toast(err.message); }
    }}, label);
}
async function applyFix(group, {m, clip, capture}) {
  const i = group[0], f = i.fix;
  const creature = m.creature || (capture || clip).dir?.split('/runs/')[0];
  if (f.action === 'reexport') { await api('/api/jobs/reexport', {capture: capture.dir}); toast('Export queued; it is checked again when done'); }
  else if (f.action === 'rebuild_rig') { await api('/api/jobs/rebuild_rig', {creature}); toast('Rig rebuild queued; the old rig is kept'); }
  else if (f.action === 'rig_task') {
    for (const j of group) await api('/api/todo', {creature, text: `${capture?.name || clip?.label} ${fmt(j.t0)}–${fmt(j.t1)}: ${j.what}`});
    toast('Added to the rig to-do list'); loadProject();
  } else if (f.action === 'recapture' && !capture) {  // straight from a clip: a new capture
    await api('/api/jobs/capture', {video: clip.path, solve: f.solve || '', clean: f.clean || '', body3d: S.info.body3d});
    toast('Capture queued; it is checked when done');
  } else if (f.action === 'recapture') {
    if (!capture.source) return toast('This capture\'s clip is unknown, so it can\'t be captured again'), false;
    await api('/api/jobs/capture', {video: capture.source, name: capture.name, replace: true, solve: f.solve || '', clean: f.clean || '',
      speed: capture.speed || 1, body3d: !!capture.body3d});
    toast('Capture queued');
  } else if (f.action === 'regenerate') {
    const src = clip || m.clips.find(c => c.path === capture?.source);
    return regenerateDialog(m, src, group);
  }
}
function regenerateDialog(m, clip, issues) {
  const base = clip?.prompt || m.prompt;
  const adds = issues.map(i => i.fix.prompt_add).filter(Boolean);
  const ta = h('textarea', {rows: 8}); ta.value = [base, ...adds.filter(a => !base.includes(a))].join(' ');
  const count = h('select', {}, ...[1, 2, 3, 4].map(n => h('option', {selected: n === 2}, n)));
  const job = clip?.job || {}, model = job.model || S.info.wan_models[0], seconds = Math.min(job.seconds || 99, S.info.wan_seconds[model]);
  const ref = job.ref || S.data.refs.find(r => r.path.startsWith(m.creature + '/'))?.path;
  return new Promise(resolve => {
    const dlg = h('dialog', {class: 'dlg'},
      h('h2', {}, 'Generate ', m.move, ' again'),
      h('p', {class: 'meta'}, issues.map(i => `${fmt(i.t0)}: ${i.what}`).join(' · ')),
      ta,
      h('p', {class: 'meta'}, `Same settings as ${clip ? 'this clip' : 'the default'}: ${model} · ${seconds} s · ${job.steps || 'default'} steps · `,
        ref ? h('a', {href: file(ref), target: '_blank'}, 'reference frame') : 'no reference frame'),
      h('div', {class: 'row', style: 'margin-top:10px'}, h('label', {}, 'New seeds', count), h('div', {class: 'spacer'}),
        h('button', {onclick: () => { dlg.close(); resolve(false); }}, 'Cancel'),

async function openEquip(creature, box) {
  let info;
  try { info = await api(`/api/equip?creature=${encodeURIComponent(creature)}`); } catch (err) { return toast(err.message, 6000); }
  if (!info.sockets.length) return box.replaceChildren(h('p', {class: 'meta'}, 'This rig has no sockets yet. ' +
    'Rebuild it (the rigging adds them), or add them to it as it is: blender -b rigged.blend -P rigging/blender/add_sockets.py.'));
  if (!info.captures.length) return box.replaceChildren(h('p', {class: 'meta'}, 'No exported captures yet: make or copy a move first.'));
  const eq = await import('/equip.js');
  const view = h('div', {style: 'height:520px;border-radius:6px;overflow:hidden;margin-top:8px'});
  const clip = h('select', {}, info.captures.map(k => h('option', {value: k.glb}, (k.move ? k.move + ' · ' : '') + k.name)));
  const kind = s => s.split('_')[1];
  const picks = Object.fromEntries(info.sockets.map(s => [s, h('select', {}, h('option', {value: ''}, 'empty'),
    ...info.items.filter(i => i.fits.includes(kind(s))).map(i => h('option', {value: i.name, selected: info.loadout[s] === i.name},
      i.name + (i.metres ? '' : ' (no real length)'))))]));
  const status = h('span', {class: 'meta'});
  const save = async () => {
    try { await api('/api/loadout', {creature, loadout: Object.fromEntries(Object.entries(picks).map(([s, p]) => [s, p.value]))}); toast('Saved as the default loadout'); }
    catch (err) { toast(err.message, 6000); }
  };
  box.replaceChildren(h('div', {class: 'row'}, 'Clip ', clip,
    ...info.sockets.flatMap(s => ['  ', s.replace('socket_', '').replace('_', ' '), ' ', picks[s]]),
    '  ', h('button', {onclick: save, title: "Written to the character's rigging/loadout.json; the game export puts it in manifest.json"}, 'Save as default loadout'), ' ', status),
    ...(info.items.length ? [] : [h('p', {class: 'meta'}, 'No items with a light copy yet: open an item in the Models tab and use one of its models for the item.')]),
    view);
  status.textContent = 'loading…';
  try {
    const viewer = new eq.Viewer(view);
    const ch = new eq.Character(await eq.load(file(info.captures[0].glb)));
    viewer.show(ch);
    const playClip = async () => {
      status.textContent = 'loading…';
      ch.addClips(await eq.load(file(clip.value)), clip.value);
      ch.play(clip.value);
      status.textContent = '';
    };
    const setItem = async s => {
      const it = info.items.find(i => i.name === picks[s].value);
      ch.equip(s, it ? (await eq.load(file(it.model))).scene : null);
    };
    clip.onchange = playClip;
    for (const s of info.sockets) { picks[s].onchange = () => setItem(s); await setItem(s); }
    await playClip();
  } catch (err) { status.textContent = 'failed: ' + err.message; }
}

// ---------------------------------------------------------------- jobs
async function pollJobs() {
  clearTimeout(pollJobs.t);
  try {
    const before = Object.fromEntries(S.jobs.map(j => [j.id, j.status]));
    S.jobs = await api('/api/jobs');
    const active = S.jobs.filter(j => j.status === 'running' || j.status === 'queued').length;
    $('#jobcount').textContent = active || '';
    if (S.jobs.some(j => before[j.id] && before[j.id] !== j.status && j.status === 'done' && j.project === S.project)) loadProject();
    if (S.tab === 'jobs') renderJobs();
    pollJobs.t = setTimeout(pollJobs, active || S.tab === 'jobs' ? 2000 : 10000);
  } catch { pollJobs.t = setTimeout(pollJobs, 5000); }
}
// Before generating a move again: its captures' automatic checks still waiting in the queue are for samples about to
// be superseded, so offer to drop them (and only them).
async function offerCancelChecks(project, move) {
  let waiting = [];
  try { waiting = await api('/api/jobs/move_checks', {project, move}); } catch { return; }
  if (!waiting.length) return;
  if (!confirm(`${waiting.length} automatic check${waiting.length === 1 ? ' is' : 's are'} still queued for earlier ${move} captures. `
               + 'Cancel them? (OK cancels them, Cancel keeps them; the new generation is queued either way.)')) return;
  try { const r = await api('/api/jobs/cancel_many', {ids: waiting.map(j => j.id)}); toast(`Cancelled ${r.cancelled} queued checks`); }
  catch (err) { toast(err.message); }
}
async function cancelJobs(body, what) {
  if (!confirm(`Cancel ${what}?`)) return;
  try {
    const r = await api('/api/jobs/cancel_many', body);
    r.ids.forEach(id => S.jobSel.delete(id));
    toast(`Cancelled ${r.cancelled} job${r.cancelled === 1 ? '' : 's'}`);
  } catch (err) { toast(err.message); }
  pollJobs();
}

function renderJobs() {

  for (const id of [...S.jobSel]) if (!active.some(j => j.id === id)) S.jobSel.delete(id);  // finished meanwhile
  main.replaceChildren(jobsBar(active), ...S.jobs.map(j => {
    const t = j.started ? Math.round(((j.ended || Date.now() / 1000) - j.started) / 60) + ' min' : '';
    const pct = j.status === 'done' ? 100 : j.steps ? 100 * j.steps[0] / j.steps[1] : 0;
    const open = S.openLogs.has(j.id);

      h('div', {class: 'row'},

        ['queued', 'running'].includes(j.status) ? h('button', {class: 'reject', onclick: () => api('/api/jobs/cancel', {id: j.id}).then(pollJobs)}, 'Cancel') : null),
      j.status === 'running' ? h('div', {class: 'bar'}, h('div', {style: `width:${pct}%`})) : null,
      open ? h('pre', {style: 'grid-column:1/4'}, j.tail) : null,
      j.script ? h('pre', {style: 'grid-column:1/4', title: 'a dry-run server only lists jobs'}, j.script) : null);
  }));

  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === (tab === 'motion' ? 'clips' : tab)));
  render(); pollJobs();
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#hideRejected').addEventListener('change', render);
// The wheel over a 3D view scrolls the page, as anywhere else; Ctrl + wheel zooms it. model-viewer would otherwise take
// every wheel turn for zooming, and the page could only be scrolled from its scrollbar. Stopped on the way down (capture
// phase, at the document) so it never reaches the viewer; the page's own scrolling is left alone.
document.addEventListener('wheel', e => { if (!e.ctrlKey && e.target.closest?.('model-viewer')) e.stopPropagation(); },
  {capture: true, passive: true});
$('#deleteRejected').addEventListener('click', () => {
  const clips = S.data.moves.flatMap(m => m.clips).filter(c => verdict(c.path) === 'reject');
  const caps = S.data.moves.flatMap(m => m.captures).filter(k => verdict(k.glb) === 'reject');
  trash([...clips.map(c => ({kind: 'clip', path: c.path})), ...caps.map(k => ({kind: 'capture', path: k.dir}))],
    `${clips.length} rejected clip${clips.length === 1 ? '' : 's'} and ${caps.length} rejected capture${caps.length === 1 ? '' : 's'}`);
});
const NEW_CHARACTER = '\u0000character', NEW_PROJECT = '\u0000project', NEW_ITEM = '\u0000item';
$('#project').addEventListener('change', e => {
  const v = e.target.value;
  if (v === NEW_CHARACTER || v === NEW_PROJECT || v === NEW_ITEM) { e.target.value = S.project || ''; return v === NEW_CHARACTER ? newCharacter() : v === NEW_ITEM ? newCharacter(undefined, true) : newProject(); }
  S.project = v; store('project', S.project); loadProject(true);
});
const groupOf = c => c.includes('/') ? c.split('/')[0] : '';
const isItem = c => c.split('/').length === 3;  // project/items/name: shared by every character in the project
function ask(title, fields, note, submit) {  // a small form in a dialog; submit(dlg) closes it when done
  const go = h('button', {class: 'primary', type: 'submit'}, 'Create');
  const form = h('form', {}, h('h2', {style: 'margin-top:0'}, title), h('div', {class: 'row'}, ...fields), h('p', {class: 'meta'}, note),
    h('div', {class: 'row', style: 'justify-content:flex-end'}, h('button', {type: 'button', onclick: () => dlg.close()}, 'Cancel'), go));
  const dlg = h('dialog', {class: 'dlg', style: 'width:min(600px,95vw)'}, form);
  form.addEventListener('submit', async e => {
    e.preventDefault(); go.disabled = true;
    try { await submit(dlg); } catch (err) { toast(err.message, 6000); } finally { go.disabled = false; }
  });
  dlg.addEventListener('close', () => dlg.remove());
  document.body.append(dlg); dlg.showModal(); form.querySelector('input')?.focus();
}
const NAME_NOTE = 'A name is letters, digits, _ . and -, starting with a letter or digit.';
// A new character: its own folder (outputs/<project>/<name>/, or outputs/<name>/ in no project) for its views, models,
// rig and clips, so working on it never touches another character. The image (optional) becomes its front view.
// An item (item true): a dagger, a quiver, anything a character holds or wears, in outputs/<project>/items/<name>/,
// shared by every character in the project; made like a character (views, TRELLIS runs).
function newCharacter(group = groupOf(S.project || ''), item = false) {
  const name = h('input', {size: 20, placeholder: item ? 'e.g. dagger' : 'e.g. knight', required: true});
  const proj = h('select', {}, ...(item ? [] : [h('option', {value: ''}, '(no project)')]), ...S.info.groups.map(g => h('option', {}, g)));
  proj.value = S.info.groups.includes(group) ? group : item ? S.info.groups[0] : '';
  const image = h('input', {type: 'file', accept: 'image/png,image/jpeg,image/webp'});
  ask(item ? 'New item' : 'New character', [h('label', {}, 'Project', proj), h('label', {}, 'Name', name), h('label', {}, 'Front image (optional)', image)],
    NAME_NOTE + (item ? ' Every character in the project can use it. It gets its own folder for its views and models.'
                      : ' It gets its own folder for its views, models, rig and clips.'), async dlg => {
      const {name: id} = await api('/api/characters', {group: proj.value, name: name.value.trim(), item});
      const f = image.files[0];
      if (f) {
        const up = await fetch(`/api/upload?project=${encodeURIComponent(id)}&name=${encodeURIComponent(f.name.replace(/[^A-Za-z0-9_.-]/g, '_'))}`, {method: 'POST', body: f});
        const i = await up.json(); if (!up.ok) throw new Error(i.error);
        await api('/api/views/add', {views_dir: id, view: 'front', image: i.path});
      }
      dlg.close();
      store('project', id); await loadProjects(id); setTab('views');
      toast(f ? `${id} created, with ${f.name} as its front view` : `${id} created: add an image as its front view`);
    });
}
function newProject() {
  const name = h('input', {size: 20, placeholder: 'e.g. fantasy', required: true});
  ask('New project', [h('label', {}, 'Name', name)], NAME_NOTE + ' A project holds characters: its first one is made next.', async dlg => {
    const {name: g} = await api('/api/groups', {name: name.value.trim()});
    dlg.close();
    S.info = await api('/api/projects'); fillProjects();
    newCharacter(g);
  });
}
function fillProjects() {
  const opt = c => h('option', {value: c}, c.split('/').pop());
  const loose = S.info.characters.filter(c => !groupOf(c));
  $('#project').replaceChildren(
    ...S.info.groups.flatMap(g => { const cs = S.info.characters.filter(c => groupOf(c) === g && !isItem(c));
      const items = S.info.characters.filter(c => groupOf(c) === g && isItem(c));
      return [h('optgroup', {label: g}, ...(cs.length ? cs.map(opt) : [h('option', {disabled: true}, '(no characters yet)')])),
        ...(items.length ? [h('optgroup', {label: g + ' · items'}, ...items.map(opt))] : [])]; }),
    ...(loose.length ? [h('optgroup', {label: S.info.groups.length ? 'No project' : 'Characters'}, ...loose.map(opt))] : []),
    h('optgroup', {label: '──────'}, h('option', {value: NEW_CHARACTER}, '+ New character…'),
      ...(S.info.groups.length ? [h('option', {value: NEW_ITEM}, '+ New item…')] : []), h('option', {value: NEW_PROJECT}, '+ New project…')));
  $('#project').value = S.project || '';
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (S.tab === 'models' && S.a && (e.key === 'k' || e.key === 'r')) review(S.a, {verdict: e.key === 'k' ? (verdict(S.a) === 'keep' ? null : 'keep') : (verdict(S.a) === 'reject' ? null : 'reject')});
  const vids = $('#moveMain').videos || [];
  if ((S.tab === 'clips' || S.tab === 'motion') && e.key === ' ') { e.preventDefault(); vids.forEach(v => v.paused ? v.play() : v.pause()); }
  if ((S.tab === 'clips' || S.tab === 'motion') && (e.key === ',' || e.key === '.')) step(vids, e.key === '.' ? 1 : -1);
});

async function loadProject(fresh) {
  const project = S.project;
  const data = await api('/api/project?name=' + encodeURIComponent(project));
  if (project !== S.project) return;  // another character was picked meanwhile
  S.data = data;
  if (fresh) { S.a = store('model.' + S.project); S.b = null; S.move = store('move.' + S.project); renderedMove = ''; viewersKey = ''; }
  if (!data.models.find(m => m.path === S.a)) S.a = [...data.models].sort((x, y) => y.mtime - x.mtime)[0]?.path || null;
  render();
}
async function loadProjects(select) {
  S.info = await api('/api/projects');
  const cs = S.info.characters;
  S.project = select || (cs.includes(store('project')) ? store('project') : cs[0]);
  fillProjects();
  tIn('tType').replaceChildren(...S.info.trellis_types.map(t => h('option', {}, t)));
  if (S.project) await loadProject(true);
}
loadProjects().then(() => setTab(store('tab') || 'views'));
</script>
</body>
</html>
